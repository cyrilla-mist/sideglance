name: Verify Decode PR

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck browser
        run: npm run typecheck
      - name: Typecheck Worker
        run: npm run worker:typecheck
      - name: Test Decode client and Worker integration
        run: npx vitest run tests/unit/decode-client.test.ts tests/integration/worker.test.ts tests/integration/cors.test.ts tests/integration/operator-gate.test.ts
      - name: Verify fixture Pages build
        run: npm run build:pages
      - name: Validate production Worker bundle without deployment
        run: npx wrangler deploy --dry-run --env production --outdir .wrangler/ci-production

  full-windows-tests:
    runs-on: windows-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Run full PowerShell-compatible unit and integration suite
        run: npm test
