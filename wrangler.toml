name = "sideglance-worker"
main = "worker/index.ts"
compatibility_date = "2026-08-21"

[env.production.vars]
CONTEXT_ENGINE_MODE = "ai"
MODEL_TRANSPORT = "google_openai_direct"
MODEL_NAME = "gemini-3.8-flash"
ALLOWED_ORIGINS = "https://cyrilla-mist.github.io"

[env.production]
name = "sideglance-worker-production"
workers_dev = true

# Operator-only safety limit: per Cloudflare location, not a global spending cap.
[[env.production.ratelimits]]
name = "AI_RATE_LIMITER"
namespace_id = "730011"

[env.production.ratelimits.simple]
limit = 3
period = 60

[dev]
ip = "127.0.0.1"
port = 8787
